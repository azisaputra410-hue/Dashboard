<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clap to JARVIS Mode</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #070b12;
      color: #e6f1ff;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 90%;
      max-width: 460px;
      padding: 24px;
      border-radius: 16px;
      background: #0e1624;
      border: 1px solid #1f334d;
      box-shadow: 0 0 30px rgba(0, 180, 255, 0.12);
    }
    .status {
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 999px;
      display: inline-block;
      margin-bottom: 14px;
      background: #172438;
      color: #8ab4f8;
    }
    .status.active {
      background: rgba(0, 212, 255, 0.2);
      color: #38e8ff;
      box-shadow: 0 0 16px rgba(56, 232, 255, 0.35);
    }
    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: #00a8e8;
      color: #041018;
      font-weight: bold;
      cursor: pointer;
    }
    .meter-wrap {
      height: 10px;
      background: #172438;
      border-radius: 999px;
      overflow: hidden;
      margin: 14px 0;
    }
    .meter-bar {
      height: 100%;
      width: 0%;
      background: #38e8ff;
      transition: width 60ms linear;
    }
    small { color: #9bb0c9; }
  </style>
</head>
<body>
  <div class="card">
    <div id="statusBadge" class="status">STANDBY — Tunggu Tepuk Tangan</div>
    <h2>JARVIS Clap Trigger</h2>
    <p id="infoText">Klik mulai, lalu tepuk tangan 2 kali untuk masuk ke mode JARVIS.</p>

    <div class="meter-wrap">
      <div id="meterBar" class="meter-bar"></div>
    </div>

    <button id="startBtn">Aktifkan Mic</button>
    <p><small id="logText">Log: belum aktif</small></p>
  </div>

  <script>
    const startBtn = document.getElementById("startBtn");
    const statusBadge = document.getElementById("statusBadge");
    const infoText = document.getElementById("infoText");
    const meterBar = document.getElementById("meterBar");
    const logText = document.getElementById("logText");

    let audioCtx, analyser, dataArray;
    let listening = false;
    let jarvisActive = false;

    // Parameter tuning deteksi tepuk tangan
    const PEAK_THRESHOLD = 0.45; // naikkan jika terlalu sensitif, turunkan jika kurang peka
    const COOLDOWN_MS = 220;     // cegah 1 tepuk terhitung ganda
    const DOUBLE_CLAP_WINDOW = 1200; // batas waktu tepukan ke-2 (ms)

    let lastClapTime = 0;
    let clapCount = 0;

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US"; // bisa diganti "id-ID"
      utter.rate = 1.05;
      window.speechSynthesis.speak(utter);
    }

    function enterJarvisMode() {
      if (jarvisActive) return;
      jarvisActive = true;
      statusBadge.textContent = "JARVIS MODE ACTIVE";
      statusBadge.classList.add("active");
      infoText.textContent = "Mode JARVIS aktif! Siap menerima perintah.";
      logText.textContent = "Log: Double clap terdeteksi -> JARVIS ON";
      speak("JARVIS online. How can I help?");

      // Otomatis balik ke standby setelah 8 detik (contoh saja)
      setTimeout(() => {
        jarvisActive = false;
        statusBadge.textContent = "STANDBY — Tunggu Tepuk Tangan";
        statusBadge.classList.remove("active");
        infoText.textContent = "Kembali ke standby. Tepuk tangan 2 kali untuk mengaktifkan.";
      }, 8000);
    }

    function onClapDetected(now) {
      if (now - lastClapTime < COOLDOWN_MS) return;

      if (now - lastClapTime <= DOUBLE_CLAP_WINDOW) {
        clapCount += 1;
      } else {
        clapCount = 1;
      }
      lastClapTime = now;

      logText.textContent = `Log: Tepukan ke-${clapCount} terdeteksi`;

      if (clapCount >= 2) {
        clapCount = 0;
        lastClapTime = 0;
        enterJarvisMode();
      }
    }

    function loop() {
      if (!listening) return;
      analyser.getByteTimeDomainData(dataArray);

      // Hitung puncak amplitudo ternormalisasi (0.0 - 1.0)
      let maxAmp = 0;
      for (let i = 0; i < dataArray.length; i++) {
        const norm = Math.abs(dataArray[i] - 128) / 128;
        if (norm > maxAmp) maxAmp = norm;
      }

      meterBar.style.width = `${Math.min(100, Math.round(maxAmp * 100))}%`;

      if (maxAmp >= PEAK_THRESHOLD) {
        onClapDetected(performance.now());
      }

      requestAnimationFrame(loop);
    }

    startBtn.addEventListener("click", async () => {
      if (listening) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: false, // kadang noiseSuppression memotong transient tepuk tangan
            autoGainControl: false
          }
        });

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        dataArray = new Uint8Array(analyser.fftSize);

        source.connect(analyser);
        listening = true;
        startBtn.textContent = "Mic Aktif";
        startBtn.disabled = true;
        logText.textContent = "Log: Mendengarkan tepuk tangan...";
        loop();
      } catch (err) {
        logText.textContent = `Error akses mic: ${err.message}`;
      }
    });
  </script>
</body>
</html>
